[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "al-kripto"
version = "0.1.0"
description = "Güvenlik öncelikli kripto strateji araştırma ve işlem otomasyonu"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "al-kripto contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
