name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        id: ruff
        continue-on-error: true
        run: ruff check . 2>&1 | tee ruff.log

      - name: Report Ruff lint failure
        if: github.event_name == 'pull_request' && steps.ruff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Ruff CI tanı çıktısı"
            echo
            echo '```text'
            cat ruff.log
            echo '```'
          } > ruff-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file ruff-comment.md

      - name: Stop after Ruff lint failure
        if: steps.ruff.outcome == 'failure'
        run: exit 1

      - name: Ruff format
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Tests
        run: pytest --cov=al_kripto --cov-report=term-missing --cov-report=xml

      - name: Dependency audit
        run: pip-audit . --skip-editable
